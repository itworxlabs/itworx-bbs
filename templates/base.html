<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}itworx-bbs{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="flex min-h-screen flex-col bg-white text-[13px] leading-5 text-gray-800">
  <header class="bg-blue-900"><div class="mx-auto max-w-[960px] px-3 py-2"><a href="/" class="text-base font-bold text-white hover:underline">itworx-bbs</a></div></header>
  <div class="mx-auto w-full max-w-[960px] px-3 pt-4"><p class="border-b-2 border-blue-900 pb-1 text-lg font-bold text-blue-900"><a class="hover:underline" href="/">자유게시판</a></p></div>
  <main id="main" class="mx-auto w-full max-w-[960px] flex-1 px-3 py-4">
    {% if notice %}<p role="status" class="mb-3 rounded-sm border border-blue-200 bg-blue-50 px-3 py-2 text-blue-900">{{ notice }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="border-t border-gray-200 bg-gray-50"><p class="mx-auto max-w-[960px] px-3 py-3 text-xs text-gray-500">© itworx-bbs</p></footer>
</body>
</html>
