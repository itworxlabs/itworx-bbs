<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}itworx-bbs{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="border-b border-gray-200 bg-white"><div class="mx-auto max-w-3xl px-4 py-3"><a href="/" class="text-lg font-bold">itworx-bbs</a></div></header>
  <main id="main" class="mx-auto max-w-3xl px-4 py-6">
    {% if notice %}<p role="status" class="mb-4 rounded border border-green-300 bg-green-50 px-4 py-3 text-green-800">{{ notice }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
