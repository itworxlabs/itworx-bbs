{% extends "base.html" %}

{% block content %}
  {% if search_error %}<p id="search-q-error" role="alert" class="mb-3 rounded-sm border border-red-300 bg-red-50 px-3 py-2 text-red-700">{{ search_error }}</p>{% endif %}
  {% include "_post_list.html" %}
  <form method="get" action="/" role="search" class="mt-4 flex flex-wrap items-center justify-center gap-1">
    <label for="search-field" class="sr-only">검색 대상</label>
    <select id="search-field" name="field" class="rounded-sm border border-gray-300 bg-white px-2 py-1 focus:outline-2 focus:outline-offset-1 focus:outline-blue-900">
      {% for value, label in search_fields %}<option value="{{ value }}"{% if value == field %} selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
    <label for="search-q" class="sr-only">검색어</label>
    <input type="search" id="search-q" name="q" value="{{ q }}" maxlength="{{ search_max }}" class="w-40 rounded-sm border border-gray-300 bg-white px-2 py-1 focus:outline-2 focus:outline-offset-1 focus:outline-blue-900 aria-invalid:border-red-600 sm:w-56"{% if search_error %} aria-invalid="true" aria-describedby="search-q-error"{% endif %}>
    <button type="submit" class="rounded-sm bg-blue-900 px-3 py-1 font-medium text-white hover:bg-blue-800 focus:outline-2 focus:outline-offset-2 focus:outline-blue-900">검색</button>
  </form>
{% endblock %}
