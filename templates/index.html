{% extends "base.html" %}

{% block content %}
  <div class="mb-4 flex flex-wrap items-center justify-between gap-4">
    <a class="text-blue-700 underline hover:text-blue-900" href="/posts/new">글쓰기</a>
    <form method="get" action="/" role="search" class="flex flex-wrap items-center gap-2">
      <label for="search-field" class="sr-only">검색 대상</label>
      <select id="search-field" name="field" class="rounded border border-gray-300 bg-white px-3 py-2 focus:outline-2 focus:outline-offset-1 focus:outline-blue-600">
        {% for value, label in search_fields %}<option value="{{ value }}"{% if value == field %} selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
      <label for="search-q" class="sr-only">검색어</label>
      <input type="search" id="search-q" name="q" value="{{ q }}" maxlength="100" class="rounded border border-gray-300 bg-white px-3 py-2 focus:outline-2 focus:outline-offset-1 focus:outline-blue-600 aria-invalid:border-red-600"{% if search_error %} aria-invalid="true" aria-describedby="search-q-error"{% endif %}>
      <button type="submit" class="rounded bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700 focus:outline-2 focus:outline-offset-2 focus:outline-blue-600">검색</button>
    </form>
  </div>
  {% if search_error %}<p id="search-q-error" role="alert" class="mb-4 rounded border border-red-300 bg-red-50 px-4 py-3 text-red-700">{{ search_error }}</p>{% endif %}
  {% include "_post_list.html" %}
{% endblock %}
