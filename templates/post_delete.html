{% extends "base.html" %}

{% block title %}글 삭제 - itworx-bbs{% endblock %}

{% block content %}<main id="main">
  <style>.error { color: #c00; }</style>
  <h1>글 삭제</h1>
  <p>이 글을 삭제하시겠습니까?</p>
  <p>제목: {{ post.title }}</p>
  <form method="post" action="/posts/{{ post.id }}/delete">
    <div>
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password"{% if errors.password %} aria-invalid="true" aria-describedby="password-error"{% endif %}>
      {% if errors.password %}<p class="error" id="password-error">{{ errors.password }}</p>{% endif %}
    </div>
    <button type="submit">삭제</button>
    <a href="/posts/{{ post.id }}">취소</a>
  </form>
</main>{% endblock %}
