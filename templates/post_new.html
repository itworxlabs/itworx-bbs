{% extends "base.html" %}

{% block title %}글쓰기 - itworx-bbs{% endblock %}

{% block content %}<main id="main">
  <h1>글쓰기</h1>
  <form method="post" action="/posts">
    <div>
      <label for="title">제목</label>
      <input type="text" id="title" name="title" value="{{ form.title }}">
      {% if errors.title %}<p class="error">{{ errors.title }}</p>{% endif %}
    </div>
    <div>
      <label for="author">작성자</label>
      <input type="text" id="author" name="author" value="{{ form.author }}">
      {% if errors.author %}<p class="error">{{ errors.author }}</p>{% endif %}
    </div>
    <div>
      <label for="content">내용</label>
      <textarea id="content" name="content" rows="10">{{ form.content }}</textarea>
      {% if errors.content %}<p class="error">{{ errors.content }}</p>{% endif %}
    </div>
    <button type="submit">등록</button>
    <a href="/">취소</a>
  </form>
</main>{% endblock %}
