[project]
name = "itworx-bbs"
version = "0.1.0"
description = "itworx 게시판 서비스"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytailwindcss>=0.4.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
